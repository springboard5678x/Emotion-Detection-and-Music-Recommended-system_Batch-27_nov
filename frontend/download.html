<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><title>MoodMate AI | Extension Guide</title>
    <link href="https://fonts.googleapis.com/css2?family=Circular+Std:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { background: #0D1117; color: white; font-family: 'Circular Std', sans-serif; padding: 50px; text-align: center; }
        .guide-card { background: #161B22; padding: 40px; border-radius: 20px; border: 1px solid #30363D; max-width: 600px; margin: 0 auto; text-align: left; }
        .step { margin-bottom: 25px; display: flex; gap: 15px; }
        .step-num { background: #1DB954; color: black; min-width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; }
        .btn-dl { display: inline-block; background: #1DB954; color: black; padding: 15px 30px; border-radius: 30px; text-decoration: none; font-weight: bold; margin-top: 20px; }
    </style>
</head>
<body>
    <h1>Take your Flow Everywhere</h1>
    <div class="guide-card">
        <div class="step">
            <div class="step-num">1</div>
            <div><strong>Download:</strong> Get the MoodMate-Extension.zip below.</div>
        </div>
        <div class="step">
            <div class="step-num">2</div>
            <div><strong>Unzip:</strong> Extract the folder to your project directory.</div>
        </div>
        <div class="step">
            <div class="step-num">3</div>
            <div><strong>Load:</strong> Open Chrome Extensions (<code>chrome://extensions</code>), enable <strong>Developer Mode</strong>, and click "Load Unpacked". Select the extracted folder.</div>
        </div>
        <center><a href="http://127.0.0.1:8000/static/moodmate-extension.zip" 
       class="btn-dl" download>
       Download ZIP (v1.0)
    </a></center>
    </div>
</body>
</html>
